<!doctype html><html lang="en"><head><meta charset="utf-8"><title>INK & IRON — WWII Grand Strategy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a07"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ink &amp; Iron">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=9"></head><body>
<header><div class="logo">INK <span>&amp;</span> IRON</div>
<div id="date">—</div><div class="pl"><span id="pflag" class="sw"></span><b id="pname">—</b><small id="pstats"></small></div>
<div id="tension" title="World tension"><small>TENSION</small><span><i></i></span><b>0</b></div>
<div class="btns"><button id="btn-pass" title="Advance one month">End Month ▸</button>
<select id="slot" aria-label="Save slot"><option>1</option><option>2</option><option>3</option></select><button id="btn-save">Save</button><button id="btn-load">Load</button>
<button id="btn-export">Export</button><button id="btn-import">Import</button><input type="file" id="importfile" accept=".json" hidden>
<button id="btn-new">New Game</button></div></header>
<div id="ticker"><span>—</span></div>
<main><div id="mapwrap"><canvas id="map"></canvas><div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Whole world">⤢</button><button id="zme" aria-label="My country">◉</button></div>

<div class="legend"><span>Tap a country to act · rules engine</span></div></div>
<aside><div class="tabs"><button class="tab on" data-p="brief">Briefing</button><button class="tab" data-p="log">War Diary</button><button class="tab" data-p="rels">Relations</button></div>
<div id="brief" class="pane"></div><div id="log" class="pane" style="display:none"></div><div id="rels" class="pane" style="display:none"></div></aside></main>
<div id="tip"></div>
<div id="popup"><div class="pp-h"><span id="pp-flag" class="sw"></span><b id="pp-title"></b><button id="pp-close" aria-label="Close">✕</button></div>
<div id="pp-info"></div><div id="pp-tabs" class="pp-tabs"></div><div id="pp-acts" class="pp-acts"></div><div id="pp-conf"></div>
</div>
<div id="busy"><div class="ink"></div><div id="busy-t">The ink is drying…</div></div>
<div id="report" class="modal"><div class="card rp"><h2 id="rp-title"></h2><div id="rp-body"></div><button id="rp-ok">Continue ▸</button></div></div>
<div id="decision" class="modal"><div class="card dc"><div class="stamp">DECISION</div><h2 id="dc-title"></h2><p id="dc-text"></p><div id="dc-opts"></div></div></div>
<div id="start" class="modal"><div class="card"><h1>INK &amp; IRON</h1><p class="tag">December 1935. The whole world on one map. Every nation, every empire, one pen. Rewrite the war before it starts.</p>
<h3>Great Powers</h3><div id="start-majors" class="grid"></div><h3>Other Nations</h3><div id="start-minors" class="grid"></div>
<button id="start-continue">Continue autosave</button></div></div>
<script src="data.js?v=9"></script><script src="grid.js?v=9"></script><script src="game.js?v=9"></script></body></html>
